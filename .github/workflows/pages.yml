name: Download site

# Builds site/ with every published release (scripts/build-site.mjs) and deploys it to GitHub Pages:
# https://himiyosh.github.io/tonarin/ . Runs when the page or the release notes change on main, after each release
# (release.yml starts it), and by hand. Needs Pages enabled with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/releases/**"
      - "pet/ui/characters/**"
      - "scripts/build-site.mjs"
      - "scripts/lib/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
