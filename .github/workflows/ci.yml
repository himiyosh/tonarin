name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # "Node 22.x" and "Node 24.x" are required checks on main and develop: keep these names.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    env:
      # The Electron binary is only needed to run the app, not to check it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Bundle the proxy
        run: npm run build:proxy
      - name: Build the download site (sample releases)
        env:
          GITHUB_TOKEN: ${{ github.token }} # renders docs/releases/*.md with GitHub's Markdown API
        run: node scripts/build-site.mjs --fixture tests/fixtures/releases.json
      - name: No secrets or local files tracked
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.npmrc$|\.pem$|\.p12$|\.key$|(^|/)secrets\.json$|(^|/)CLAUDE\.md$|^logs/|^release/|^models/|^_site/' || true)
          if [ -n "$bad" ]; then echo "Files that must not be tracked:"; echo "$bad"; exit 1; fi

  windows:
    # The same checks on Windows: paths, zip handling and the proxy bundle behave differently there.
    name: Windows
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Bundle the proxy
        run: npm run build:proxy
