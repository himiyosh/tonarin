<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <!-- ひよこ: a chick with a sprout. The bud is the status light. -->
  <defs>
    <radialGradient id="hiyoko-body" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff6c2" />
      <stop offset="100%" stop-color="#ffd23f" />
    </radialGradient>
    <radialGradient id="hiyoko-glow" cx="50%" cy="50%" r="50%">
      <stop class="glow-core" offset="0%" />
      <stop class="glow-edge" offset="100%" />
    </radialGradient>
  </defs>

  <ellipse class="shadow" cx="100" cy="185" rx="46" ry="6.5" fill="#5a4410" fill-opacity="0.16" />

  <g class="float">
    <path d="M100 58 L100 36" stroke="#5aae4a" stroke-width="3.5" stroke-linecap="round" />
    <path d="M100 44 C 90 34, 78 36, 76 46 C 86 49, 95 49, 100 44 Z" fill="#7fd06a" stroke="#5aae4a" stroke-width="1.5" />
    <path d="M100 44 C 110 34, 122 36, 124 46 C 114 49, 105 49, 100 44 Z" fill="#7fd06a" stroke="#5aae4a" stroke-width="1.5" />
    <circle class="bulb-halo" cx="100" cy="30" r="17" fill="url(#hiyoko-glow)" />
    <circle class="bulb" cx="100" cy="30" r="7" stroke="#ffffff" stroke-width="2" />
    <g class="listen-rings">
      <circle cx="100" cy="30" r="12" />
      <circle cx="100" cy="30" r="12" />
    </g>

    <path d="M42 112 C 26 122, 28 144, 44 150 C 42 136, 42 124, 42 112 Z" fill="#ffc72c" stroke="#e5b52c" stroke-width="1.5" />
    <path d="M158 112 C 174 122, 172 144, 156 150 C 158 136, 158 124, 158 112 Z" fill="#ffc72c" stroke="#e5b52c" stroke-width="1.5" />
    <path d="M100 56 C 144 56, 166 90, 164 126 C 162 160, 136 178, 100 178 C 64 178, 38 160, 36 126 C 34 90, 56 56, 100 56 Z"
      fill="url(#hiyoko-body)" stroke="#e5b52c" stroke-width="2" />
    <ellipse cx="86" cy="179" rx="10" ry="4.5" fill="#ff9f2e" />
    <ellipse cx="114" cy="179" rx="10" ry="4.5" fill="#ff9f2e" />

    <ellipse cx="66" cy="128" rx="9" ry="5.5" fill="#ff9fb3" fill-opacity="0.55" />
    <ellipse cx="134" cy="128" rx="9" ry="5.5" fill="#ff9fb3" fill-opacity="0.55" />

    <g class="eyes">
      <g class="eye">
        <ellipse cx="82" cy="108" rx="6" ry="7.5" fill="#3a2a1a" />
        <circle cx="84.2" cy="105" r="2.2" fill="#ffffff" />
      </g>
      <g class="eye">
        <ellipse cx="118" cy="108" rx="6" ry="7.5" fill="#3a2a1a" />
        <circle cx="120.2" cy="105" r="2.2" fill="#ffffff" />
