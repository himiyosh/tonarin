      <path d="M111 109 Q118 114 125 109" />
    </g>

    <ellipse id="mouth" cx="100" cy="126" rx="3" ry="0.6" fill="#a14a18" data-open-rx="2" data-open-ry="5" />
    <path d="M92 120 L108 120 L100 127 Z" fill="#ff9f2e" stroke="#e08420" stroke-width="1.2" stroke-linejoin="round" />

    <g class="thinking-dots" fill="#ffffff" stroke="#e5b52c" stroke-width="1.5">
