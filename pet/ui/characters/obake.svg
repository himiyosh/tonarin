<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <!-- おばけ: a friendly little ghost with a floating wisp (the status light). -->
  <defs>
    <radialGradient id="obake-body" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#eef3ff" />
      <stop offset="100%" stop-color="#d3def7" />
    </radialGradient>
    <radialGradient id="obake-glow" cx="50%" cy="50%" r="50%">
      <stop class="glow-core" offset="0%" />
      <stop class="glow-edge" offset="100%" />
    </radialGradient>
  </defs>

  <ellipse class="shadow" cx="100" cy="187" rx="34" ry="5" fill="#2a3560" fill-opacity="0.12" />

  <g class="float">
    <ellipse cx="42" cy="124" rx="9" ry="6.5" fill="#eef3ff" stroke="#b7c9ea" stroke-width="2" />
    <ellipse cx="158" cy="124" rx="9" ry="6.5" fill="#eef3ff" stroke="#b7c9ea" stroke-width="2" />
    <path d="M100 50 C 142 50, 158 84, 158 120 L158 162 Q149 174 139 163 Q129 152 119 164 Q109 176 100 164 Q91 152 81 164 Q71 176 61 163 Q51 152 42 162 L42 120 C 42 84, 58 50, 100 50 Z"
      fill="url(#obake-body)" stroke="#b7c9ea" stroke-width="2" stroke-linejoin="round" />

    <ellipse cx="68" cy="122" rx="9" ry="5.5" fill="#ffb2c8" fill-opacity="0.55" />
    <ellipse cx="132" cy="122" rx="9" ry="5.5" fill="#ffb2c8" fill-opacity="0.55" />

    <g class="eyes">
      <g class="eye">
        <ellipse cx="82" cy="104" rx="7" ry="9.5" fill="#3a3f5c" />
        <circle cx="84.5" cy="100" r="2.6" fill="#ffffff" />
      </g>
      <g class="eye">
        <ellipse cx="118" cy="104" rx="7" ry="9.5" fill="#3a3f5c" />
        <circle cx="120.5" cy="100" r="2.6" fill="#ffffff" />
      </g>
    </g>
    <g class="sleepy-eyes" fill="none" stroke="#3a3f5c" stroke-width="3.2" stroke-linecap="round">
      <path d="M74 105 Q82 111 90 105" />
      <path d="M110 105 Q118 111 126 105" />
    </g>

    <ellipse id="mouth" cx="100" cy="124" rx="5" ry="2.5" fill="#3a3f5c" data-open-rx="2" data-open-ry="7" />

    <!-- wisp -->
    <circle class="bulb-halo" cx="156" cy="42" r="18" fill="url(#obake-glow)" />
    <path class="bulb" d="M150 38 C 142 32, 142 20, 150 12 C 150 20, 158 24, 162 32 Z" />
    <circle class="bulb" cx="156" cy="42" r="8" stroke="#ffffff" stroke-width="2" />
    <g class="listen-rings">
      <circle cx="156" cy="42" r="12" />
      <circle cx="156" cy="42" r="12" />
    </g>

    <g class="thinking-dots" fill="#ffffff" stroke="#b7c9ea" stroke-width="1.5">
      <circle cx="50" cy="50" r="4" />
      <circle cx="38" cy="38" r="5" />
      <circle cx="24" cy="25" r="6" />
    </g>
  </g>
</svg>
