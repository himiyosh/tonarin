<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <!-- もち: the original pet. Class API: see README "キャラクターを追加する". -->
  <defs>
    <radialGradient id="mochi-body" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#eeeaff" />
      <stop offset="100%" stop-color="#cfc6ff" />
    </radialGradient>
    <radialGradient id="mochi-glow" cx="50%" cy="50%" r="50%">
      <stop class="glow-core" offset="0%" />
      <stop class="glow-edge" offset="100%" />
    </radialGradient>
  </defs>

  <ellipse class="shadow" cx="100" cy="184" rx="50" ry="7" fill="#281e5a" fill-opacity="0.16" />

  <g class="float">
    <path d="M100 56 C 99 42, 106 32, 114 24" fill="none" stroke="#b3a6f2" stroke-width="4" stroke-linecap="round" />
    <circle class="bulb-halo" cx="116" cy="21" r="17" fill="url(#mochi-glow)" />
    <circle class="bulb" cx="116" cy="21" r="7.5" stroke="#ffffff" stroke-width="2" />
    <g class="listen-rings">
      <circle cx="116" cy="21" r="12" />
      <circle cx="116" cy="21" r="12" />
    </g>

    <path d="M100 52 C 146 52, 170 88, 168 126 C 166 160, 138 178, 100 178 C 62 178, 34 160, 32 126 C 30 88, 54 52, 100 52 Z"
      fill="url(#mochi-body)" stroke="#b3a6f2" stroke-width="2" />
    <ellipse cx="74" cy="177" rx="14" ry="6" fill="#ddd6ff" stroke="#b3a6f2" stroke-width="1.5" />
    <ellipse cx="126" cy="177" rx="14" ry="6" fill="#ddd6ff" stroke="#b3a6f2" stroke-width="1.5" />

    <ellipse cx="62" cy="130" rx="10" ry="6" fill="#ffb2c8" fill-opacity="0.55" />
    <ellipse cx="138" cy="130" rx="10" ry="6" fill="#ffb2c8" fill-opacity="0.55" />

    <g class="eyes">
      <g class="eye">
        <ellipse cx="78" cy="110" rx="8.5" ry="11.5" fill="#2d2a4a" />
        <circle cx="81" cy="105" r="3" fill="#ffffff" />
      </g>
      <g class="eye">
        <ellipse cx="122" cy="110" rx="8.5" ry="11.5" fill="#2d2a4a" />
        <circle cx="125" cy="105" r="3" fill="#ffffff" />
      </g>
    </g>
    <g class="sleepy-eyes" fill="none" stroke="#2d2a4a" stroke-width="3.5" stroke-linecap="round">
      <path d="M69 111 Q78 117 87 111" />
      <path d="M113 111 Q122 117 131 111" />
    </g>

    <ellipse id="mouth" cx="100" cy="137" rx="7" ry="2.5" fill="#6d4a7c" data-open-rx="3" data-open-ry="9" />

    <g class="thinking-dots" fill="#ffffff" stroke="#b3a6f2" stroke-width="1.5">
      <circle cx="146" cy="52" r="4" />
      <circle cx="158" cy="40" r="5" />
      <circle cx="172" cy="27" r="6" />
    </g>
  </g>
</svg>
