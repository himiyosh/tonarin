<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <!-- ロボ: a small monitor-headed robot. -->
  <defs>
    <linearGradient id="robo-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe" />
      <stop offset="100%" stop-color="#cdd6e5" />
    </linearGradient>
    <linearGradient id="robo-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26324e" />
      <stop offset="100%" stop-color="#172036" />
    </linearGradient>
    <radialGradient id="robo-glow" cx="50%" cy="50%" r="50%">
      <stop class="glow-core" offset="0%" />
      <stop class="glow-edge" offset="100%" />
    </radialGradient>
  </defs>

  <ellipse class="shadow" cx="100" cy="185" rx="44" ry="6.5" fill="#1e2a46" fill-opacity="0.18" />

  <g class="float">
    <line x1="100" y1="52" x2="100" y2="32" stroke="#8d9bb5" stroke-width="4" stroke-linecap="round" />
    <circle class="bulb-halo" cx="100" cy="24" r="17" fill="url(#robo-glow)" />
    <circle class="bulb" cx="100" cy="24" r="7.5" stroke="#ffffff" stroke-width="2" />
    <g class="listen-rings">
      <circle cx="100" cy="24" r="12" />
      <circle cx="100" cy="24" r="12" />
    </g>

    <!-- arms and body -->
    <rect x="56" y="148" width="14" height="22" rx="7" fill="#b8c3d6" stroke="#8d9bb5" stroke-width="1.5" />
    <rect x="130" y="148" width="14" height="22" rx="7" fill="#b8c3d6" stroke="#8d9bb5" stroke-width="1.5" />
    <rect x="89" y="138" width="22" height="10" rx="3" fill="#a9b5ca" />
    <rect x="68" y="144" width="64" height="32" rx="12" fill="url(#robo-shell)" stroke="#8d9bb5" stroke-width="2" />
    <g stroke="#b3bfd3" stroke-width="2.5" stroke-linecap="round">
      <line x1="86" y1="156" x2="114" y2="156" />
      <line x1="86" y1="164" x2="114" y2="164" />
    </g>
    <ellipse cx="84" cy="179" rx="13" ry="5.5" fill="#8d9bb5" />
    <ellipse cx="116" cy="179" rx="13" ry="5.5" fill="#8d9bb5" />

    <!-- head -->
    <circle cx="42" cy="98" r="9" fill="#b8c3d6" stroke="#8d9bb5" stroke-width="2" />
    <circle cx="158" cy="98" r="9" fill="#b8c3d6" stroke="#8d9bb5" stroke-width="2" />
    <rect x="46" y="50" width="108" height="92" rx="26" fill="url(#robo-shell)" stroke="#8d9bb5" stroke-width="2" />
    <rect x="58" y="63" width="84" height="64" rx="16" fill="url(#robo-screen)" stroke="#3a4868" stroke-width="1.5" />
    <path d="M66 72 Q70 66 80 66 L96 66" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />

    <rect x="66" y="108" width="11" height="4" rx="2" fill="#ff8fb8" fill-opacity="0.65" />
    <rect x="123" y="108" width="11" height="4" rx="2" fill="#ff8fb8" fill-opacity="0.65" />

    <g class="eyes">
      <g class="eye">
        <ellipse cx="82" cy="92" rx="11" ry="12" fill="#7cf3ff" fill-opacity="0.18" />
        <ellipse cx="82" cy="92" rx="6.5" ry="8.5" fill="#7cf3ff" />
        <circle cx="84.5" cy="88.5" r="2.2" fill="#e9feff" />
      </g>
      <g class="eye">
        <ellipse cx="118" cy="92" rx="11" ry="12" fill="#7cf3ff" fill-opacity="0.18" />
        <ellipse cx="118" cy="92" rx="6.5" ry="8.5" fill="#7cf3ff" />
        <circle cx="120.5" cy="88.5" r="2.2" fill="#e9feff" />
      </g>
    </g>
    <g class="sleepy-eyes" fill="none" stroke="#7cf3ff" stroke-width="3" stroke-linecap="round">
      <path d="M75 93 Q82 98 89 93" />
      <path d="M111 93 Q118 98 125 93" />
    </g>

    <rect id="mouth" x="92" y="112" width="16" height="3" rx="1.5" fill="#7cf3ff" data-open-w="6" data-open-h="9" />

    <g class="thinking-dots" fill="#ffffff" stroke="#8d9bb5" stroke-width="1.5">
      <circle cx="148" cy="42" r="4" />
      <circle cx="160" cy="31" r="5" />
      <circle cx="174" cy="19" r="6" />
    </g>
  </g>
</svg>
