<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <!-- きつね: a fox with a floating fox-fire orb (the status light). -->
  <defs>
    <radialGradient id="kitsune-fur" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffb870" />
      <stop offset="100%" stop-color="#e2772c" />
    </radialGradient>
    <radialGradient id="kitsune-glow" cx="50%" cy="50%" r="50%">
      <stop class="glow-core" offset="0%" />
      <stop class="glow-edge" offset="100%" />
    </radialGradient>
  </defs>

  <ellipse class="shadow" cx="100" cy="185" rx="50" ry="6.5" fill="#4a2410" fill-opacity="0.16" />

  <g class="float">
    <!-- tail -->
    <path d="M132 172 C 176 172, 190 130, 172 104 C 166 96, 156 98, 158 108 C 166 128, 160 150, 132 156 Z"
      fill="url(#kitsune-fur)" stroke="#c4651f" stroke-width="2" stroke-linejoin="round" />
    <path d="M172 104 C 166 96, 156 98, 158 108 C 160 114, 162 118, 163 122 C 170 118, 176 112, 172 104 Z" fill="#fff6ec" />

    <!-- body and paws -->
    <path d="M60 178 C 54 152, 72 132, 100 132 C 128 132, 146 152, 140 178 Z" fill="url(#kitsune-fur)" stroke="#c4651f" stroke-width="2" />
    <path d="M84 136 Q100 172 116 136 Z" fill="#fff6ec" />
    <ellipse cx="86" cy="178" rx="12" ry="6" fill="#fff6ec" stroke="#c4651f" stroke-width="1.5" />
    <ellipse cx="114" cy="178" rx="12" ry="6" fill="#fff6ec" stroke="#c4651f" stroke-width="1.5" />

    <!-- ears and head -->
    <path d="M56 86 L60 34 L92 66 Z" fill="#f08a3c" stroke="#c4651f" stroke-width="2" stroke-linejoin="round" />
    <path d="M64 78 L66 48 L84 66 Z" fill="#4a2c1f" />
    <path d="M144 86 L140 34 L108 66 Z" fill="#f08a3c" stroke="#c4651f" stroke-width="2" stroke-linejoin="round" />
    <path d="M136 78 L134 48 L116 66 Z" fill="#4a2c1f" />
    <path d="M100 62 C 134 62, 158 84, 160 104 C 150 124, 126 140, 100 142 C 74 140, 50 124, 40 104 C 42 84, 66 62, 100 62 Z"
      fill="url(#kitsune-fur)" stroke="#c4651f" stroke-width="2" />
    <path d="M100 106 C 116 106, 138 112, 152 106 C 142 126, 122 138, 100 140 C 78 138, 58 126, 48 106 C 62 112, 84 106, 100 106 Z" fill="#fff6ec" />
    <ellipse cx="64" cy="114" rx="8" ry="5" fill="#ff9fb3" fill-opacity="0.45" />
    <ellipse cx="136" cy="114" rx="8" ry="5" fill="#ff9fb3" fill-opacity="0.45" />

    <g class="eyes">
      <g class="eye">
        <ellipse cx="80" cy="97" rx="6" ry="8" fill="#2b1d14" />
        <circle cx="82.2" cy="93.5" r="2.2" fill="#ffffff" />
      </g>
      <g class="eye">
        <ellipse cx="120" cy="97" rx="6" ry="8" fill="#2b1d14" />
        <circle cx="122.2" cy="93.5" r="2.2" fill="#ffffff" />
      </g>
    </g>
    <g class="sleepy-eyes" fill="none" stroke="#2b1d14" stroke-width="3" stroke-linecap="round">
      <path d="M73 98 Q80 103 87 98" />
      <path d="M113 98 Q120 103 127 98" />
    </g>

    <ellipse cx="100" cy="115" rx="4.5" ry="3.2" fill="#2b1d14" />
    <ellipse id="mouth" cx="100" cy="124" rx="2.5" ry="0.4" fill="#8b2f33" data-open-rx="3" data-open-ry="5" />
    <path d="M94 121 Q97 124.5 100 121 Q103 124.5 106 121" fill="none" stroke="#6a3a26" stroke-width="1.8" stroke-linecap="round" />

    <!-- fox fire -->
    <circle class="bulb-halo" cx="170" cy="82" r="18" fill="url(#kitsune-glow)" />
    <path class="bulb" d="M170 66 C 176 72, 179 78, 177 84 C 175 90, 165 90, 163 84 C 161 78, 165 72, 170 66 Z" />
    <circle class="bulb" cx="170" cy="83" r="6.5" stroke="#ffffff" stroke-width="2" />
    <g class="listen-rings">
      <circle cx="170" cy="82" r="12" />
      <circle cx="170" cy="82" r="12" />
    </g>

    <g class="thinking-dots" fill="#ffffff" stroke="#c4651f" stroke-width="1.5">
      <circle cx="52" cy="50" r="4" />
      <circle cx="40" cy="38" r="5" />
      <circle cx="26" cy="25" r="6" />
    </g>
  </g>
</svg>
